# =============================================================================
# FILTERING SETTINGS
# =============================================================================
filtering:
  min_trust_score: 0.7               # Minimum trust score for articles
  max_age_days: 1                    # Maximum age in days (fractional, e.g., 0.5 for 12 hours)
  min_long_read_length: 2000         # Minimum character count for "long read" articles
