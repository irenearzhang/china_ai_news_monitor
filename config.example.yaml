# =============================================================================
# SOURCE TRUST WEIGHTS
# =============================================================================
source_weights:
  新华社: 1.0
  人民网: 1.0
  央视新闻: 1.0
  财新: 1.0
  南方周末: 1.0
  国务院公报: 1.0
  工信部: 1.0
  网信办: 1.0
  科技部: 1.0
  发改委: 1.0
  36氪: 0.9
  量子位: 0.9
  机器之心: 0.9
  澎湃新闻: 0.9
  第一财经: 0.8
  新京报: 0.8
  凤凰周刊: 0.7
