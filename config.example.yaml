# China AI News Monitor - Configuration Template
# Copy this file to config.yaml and fill in your own settings

# =============================================================================
# EMAIL CONFIGURATION
# =============================================================================
email:
  smtp_server: smtp.gmail.com        # SMTP server (e.g., smtp.gmail.com, smtp.office365.com)
  smtp_port: 587                     # SMTP port (587 for TLS, 465 for SSL)
  sender_email: your-email@gmail.com  # Your email address
  sender_password: your-app-password  # App password (NOT your regular password!)
  recipient_email: friend@example.com # Recipient email address
  sender_name: China AI News Monitor  # Display name in emails

# =============================================================================
# MONITORING SETTINGS
# =============================================================================
monitoring:
  send_time: "08:00"                 # Time to send daily digest (24-hour format, e.g., "08:00")
  timezone: "US/Pacific"             # Your timezone (e.g., "US/Pacific", "Asia/Shanghai", "Europe/London")
  max_articles_per_category: 10      # Maximum articles per category
  # Schedule settings
  days_of_week: [1, 2, 3, 4, 5]      # Monday=1, Friday=5 (weekdays only)
  # Article age limits
  normal_hours: 24                   # Articles from last 24 hours (Tue-Fri)
  monday_hours: 72                   # Articles from last 72 hours (Monday - covers weekend)

# =============================================================================
# NEWS CATEGORIES
# =============================================================================
categories:
