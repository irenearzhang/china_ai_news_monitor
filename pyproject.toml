[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "china-ai-news-monitor"
version = "1.0.0"
description = "A daily email digest service monitoring Chinese AI news from 180+ sources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "flask>=3.0.0",
    "email-validator>=2.0.0",
    "requests>=2.31.0",
    "schedule>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "colorlog>=6.7.0",
]

[project.scripts]
start = "app:main"

[tool.setuptools.packages.find]
include = ["china_ai_news_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
